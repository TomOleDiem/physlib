version: v0.1

Title: Finite-dimensional quantum systems

Overview: |
    `QuantumInfo` already contains most of the mathematical content this API needs —
    `HermitianMat`, `MState`, `POVM`, `Matrix.unitaryGroup`, entropy, channels — but it was
    developed independently, indexed by a bare `Fintype d` rather than by a Hilbert space, and
    was never integrated into the rest of Physlib's API structure (see
    `Physlib/Meta/TODO/Global.lean`'s own standing TODO on this). Other parts of Physlib have
    separately grown finite-dimensional pieces towards the same goal — `QuantumSystem`, the
    top-level `FiniteTarget` structure — without a shared foundation underneath them. This API
    organizes all of that, once and for all, into a single coherent hierarchy.

    `Basic.lean` already gives the starting point: `FiniteHilbertSpace d` (`𝓗[d]`), with its
    vector-space structure (`AddCommGroup`, `Module ℂ`) and Hilbert-space structure
    (`NormedAddCommGroup`, `InnerProductSpace ℂ`, `FiniteDimensional ℂ`, `CompleteSpace`)
    transferred and induced from `EuclideanSpace ℂ d`. What remains is everything about the
    *linear maps* on this space. The observable algebra is `𝒜(H) := H →L[ℂ] H`: Mathlib already
    gives this a full `CStarAlgebra` instance for any `H` satisfying the hypothesis bundle
    above. Once a basis is fixed, `𝒜(H)` is exactly the matrices `Matrix d d ℂ`.

    On top of `𝒜(H)` sits a fixed hierarchy, `𝒜(H) ⊃ Observable H ⊃ 𝒜(H)₊ ⊃ State H, Effect H`,
    matching the usual physical picture. `Observable H` is the self-adjoint elements of
    `𝒜(H)`, a real vector space: physically, these are the measurable quantities of the system
    — energy, position, spin — and self-adjointness is exactly what forces their eigenvalues,
    the possible measurement outcomes, to be real. `𝒜(H)₊`, the positive cone, singles out the
    operators whose expectation value `⟨ψ, Aψ⟩` is never negative — the operator analogue of a
    nonnegative real number, like a variance or a probability. This gives `Observable H` a
    partial order, `A ≤ B` when `B − A` is positive, the same order used below to say a density
    operator is `≤ 1` or that an effect lies between `0` and `1`. `State H` is the positive
    elements of trace `1` — the density operators `ρ` — each of which assigns to every
    observable `A` an expectation value `tr(ρA)`; abstractly, a state is any normalized
    positive linear functional `ω : 𝒜(H) → ℂ`, and in finite dimension these two notions
    coincide. `Effect H` is the order interval `[0, 1]`: an operator whose expectation value
    `ω(E)` in any state is always a genuine probability, so effects are exactly the possible
    outcomes of a quantum measurement. A POVM packages a whole measurement, with several
    possible outcomes, as a finite family of effects summing to `1`, one per outcome, whose
    expectation values give the outcome probabilities (the Born rule). Unitaries act on the
    whole hierarchy at once as `*`-automorphisms `A ↦ U A U†`, which is how symmetries and time
    evolution are represented; a Hamiltonian is a self-adjoint operator generating a
    one-parameter family of them, `U(t) = exp(-itH)`, giving the Heisenberg picture (operators
    evolve) and Schrödinger picture (states evolve) of the same physics.

    A few more theorems round out the picture. The finite spectral theorem diagonalizes every
    observable, `A = Σ_λ λ P_λ`: the eigenvalues are the possible measurement outcomes, and
    the eigenprojections are the effects a projective measurement of `A` would use; a
    commuting family of observables shares such a basis simultaneously. Stone's theorem is an
    isomorphism between the one-parameter unitary groups `U(t) = exp(-itH)` and the
    self-adjoint operators `H`: every norm-continuous one-parameter unitary group has a
    unique self-adjoint generator, and every self-adjoint operator generates exactly one such
    group. Wigner's theorem says that any bijection of the pure states which preserves the
    transition probability `|⟨φ, ψ⟩|²` — any symmetry of the physics — is implemented by a
    unitary or an antiunitary operator, which is why unitaries were the right notion of
    symmetry all along. For a whole symmetry group `G` acting on the system, this becomes a
    projective unitary or antiunitary representation of `G`, since only the ray of a state,
    not its phase, is physical. Bargmann's theorem says that such a projective representation
    can be realized as an honest, non-projective unitary representation — not of `G` itself,
    but of a slightly larger group `G̃` built from `G` by tacking on an extra central factor
    that absorbs the phases; this is why, for instance, spin representations of the rotation
    group are genuine representations of `SU(2)`, the double cover of `SO(3)`, rather than
    merely projective representations of `SO(3)` itself. Complete reducibility and Schur's
    lemma then explain how such representations actually look: every unitary representation
    of `G` splits as an orthogonal direct sum of irreducible ones, and on an irreducible
    representation the only operators commuting with the whole group are scalar multiples of
    the identity — together, this is why symmetry alone sorts a system's states into blocks,
    such as energy eigenspaces labelled by angular momentum, before any particular dynamics is
    chosen.

    Composite systems bring a further set of theorems. Kraus's theorem writes any completely
    positive map as `Φ(ρ) = Σ_i K_i ρ K_i†`; Stinespring's theorem realizes the same map as a
    unitary evolution on a larger system followed by discarding an environment; Naimark's
    theorem does the analogous thing for measurements, realizing any POVM as a projective
    measurement after such an enlargement. The Schmidt decomposition puts any bipartite pure
    state `ψ ∈ H_A ⊗ H_B` into a canonical two-index form, and Choi's theorem gives the fully
    algebraic test for complete positivity: a map is CP exactly when its Choi matrix is
    positive.

