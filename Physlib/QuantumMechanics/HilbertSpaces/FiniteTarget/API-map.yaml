Requirements:

  - description: |
      The Hilbert space of a finite target quantum system, `FiniteHilbertSpace d` (notation
      `𝓗[d]`), is defined for a finite, decidable index type `d`, with its vector space
      structure transferred and its Hilbert space structure (norm, inner product, finite
      dimensionality, completeness) induced from `EuclideanSpace ℂ d`, together with its
      standard orthonormal basis.
    done: true
    location: |
      Physlib/QuantumMechanics/HilbertSpaces/FiniteTarget/Basic.lean

  - description: |
      The operator algebra `𝒜(H) := H →L[ℂ] H` shall be identified as a `CStarAlgebra`, via
      Mathlib's existing instance for `H →L[ℂ] H` on any Hilbert space, which already gives
      multiplication, adjoint, norm and the C*-identity `‖A† A‖ = ‖A‖²`; this file shall add
      only the commutator `⁅A, B⁆ := A * B - B * A`.
    done: false
    location: N/A

  - description: |
      The trace `tr : 𝒜(H) → ℂ` shall be defined, linear, cyclic, positive on positive
      operators, and invariant under unitary conjugation.
    done: false
    location: N/A

  - description: |
      `Observable H`, the self-adjoint elements of `𝒜(H)`, shall be defined as a real vector
      space with a spectral decomposition `A = Σ_λ λ P_λ` (Mathlib's
      `Matrix.IsHermitian.spectral_theorem` under a choice of basis), and functional
      calculus `f(A) := Σ_λ f(λ) P_λ` for any real-valued function `f`, showing `f(A)` is
      again self-adjoint.
    done: false
    location: N/A

  - description: |
      The positive cone `𝒜(H)₊ := {A | ∀ ψ, 0 ≤ ⟨ψ, A ψ⟩}` shall be defined: closed under
      addition, nonnegative scalar multiples and conjugation `A ↦ B† A B`.
      The order `A ≤ B := 0 ≤ B - A` on `Observable H` shall be defined here.
    done: false
    location: N/A

  - description: |
      Density operators `State H := {ρ : Observable H // 0 ≤ ρ ∧ tr ρ = 1}` shall be defined,
      each inducing the positive, normalized linear functional `A ↦ tr (ρ A)` on `𝒜(H)`, and
      proven in bijection with `MState d` under a choice of basis
      (`QuantumInfo/States/Mixed/MState.lean`).
    done: false
    location: N/A

  - description: |
      Pure states shall be defined as the extreme points of `State H`, and proven equivalent
      to `ρ² = ρ`, rank one, `tr (ρ²) = 1`, and `ρ = |ψ⟩⟨ψ|` for a unit vector `ψ` unique up
      to a unit complex scalar.
    done: false
    location: N/A

  - description: |
      The von Neumann entropy `S(ρ) := -tr (ρ log ρ)` shall be defined via the functional
      calculus above applied to `ρ`, reusing `QuantumInfo/Entropy/VonNeumann.lean`'s `Sᵥₙ`
      under a choice of basis, with `S(ρ) ≥ 0` and `S(ρ) = 0` iff `ρ` is pure.
    done: false
    location: N/A

  - description: |
      `Effect H`, the self-adjoint operators `E` with `0 ≤ E ≤ 1`, shall be defined, with the
      Born rule `p E := tr (ρ E)` recorded as the probability of an effect in a density
      operator `ρ`.
    done: false
    location: N/A

  - description: |
      Finite POVMs — finite families of effects summing to `1` — shall be defined out of
      `Effect H`, with the outcome distribution `p x := tr (ρ (E x))` they induce on a
      density operator `ρ`, and projective measurements identified with POVMs of
      projections.
    done: false
    location: N/A

  - description: |
      Conjugation by a unitary, `Ad U A := U A U†`, shall be shown to be a unital
      `*`-automorphism of `𝒜(H)`, with preservation of positivity, order, `Observable H`,
      `Effect H` and the trace derived from that single fact, and its action on density
      operators, `ρ ↦ U ρ U†`, shall be defined.
    done: false
    location: N/A

  - description: |
      The expectation value `⟨A⟩_ρ := tr (ρ A)` and the variance
      `Var_ρ A := tr (ρ A²) - tr (ρ A)²` shall be defined for a density operator `ρ`.
    done: false
    location: N/A

  - description: |
      For a time-independent self-adjoint Hamiltonian `H`, the time-evolution unitary
      `U t := exp (-i t H)` shall be defined as a one-parameter unitary group, reusing
      Stone's correspondence `UnitaryOneParameterGroup.stoneEquiv`
      (`Physlib/Mathematics/OneParameterSubgroups/Unitary.lean`)
      with the Heisenberg-picture `*`-automorphism it generates and the induced
      Schrödinger-picture action on states; time-dependent Hamiltonians are out of scope.
    done: false
    location: N/A

  - description: |
      Not yet started: composite finite target quantum systems, built from the tensor
      product of operator algebras `𝒜(A ⊗ B) ≃ 𝒜(A) ⊗ 𝒜(B)`, local `*`-homomorphisms,
      observables, the partial trace, and separability, ...
    done: false
    location: N/A
